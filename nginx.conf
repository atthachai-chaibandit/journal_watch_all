server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text-based assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Angular uses client-side routing — any path that isn't a real file
    # must fall back to index.html, otherwise refreshing a deep link
    # (e.g. /admin/dashboard) returns a 404 from Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build assets aggressively; index.html itself must NOT
    # be cached, otherwise users keep loading an old app shell after a
    # new deploy.
    location ~* \.(?:css|js|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
